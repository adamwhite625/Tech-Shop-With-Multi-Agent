version: "3.8"

services:
  mysql_db:
    image: mysql:8.0
    container_name: tech_mysql
    environment:
      MYSQL_DATABASE: tech_store_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      # Nạp schema tự động
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      # Lưu trữ data để không bị mất khi tắt Docker
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
